[project]
name = "support-portal"
version = "0.1.0"
description = "Django project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleach>=6.4.0",
    "django>=5.2.16,<6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "*/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "B",
    "DJ",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
